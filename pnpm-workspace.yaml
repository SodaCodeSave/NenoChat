packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ 用 allowBuilds 映射替代旧的 onlyBuiltDependencies 数组（旧键会被静默忽略）
# 这几个包必须执行 postinstall 拉取或编译平台二进制
allowBuilds:
  better-sqlite3: true
  sharp: true
  "@node-rs/argon2": true
  esbuild: true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-x64": true
