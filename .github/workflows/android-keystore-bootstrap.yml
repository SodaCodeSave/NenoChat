name: Bootstrap Android Keystore

# 一次性生成正式签名密钥。配置 BOOTSTRAP_PAT secret 后可自动写入仓库 Secrets，
# 否则把三个值打印到日志手动填写。生成后本工作流可删除。
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and save secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nenochat-release.jks"
          ALIAS="nenochat"
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NenoChat, OU=NenoChat, O=NenoChat, L=Unknown, ST=Unknown, C=CN" \
            >/dev/null 2>&1

          BASE64=$(base64 -w 0 "$KEYSTORE")

          if [ -n "$GH_TOKEN" ]; then
            gh secret set ANDROID_KEY_BASE64 --body "$BASE64"
            gh secret set ANDROID_KEY_ALIAS --body "$ALIAS"
            gh secret set ANDROID_KEY_PASSWORD --body "$PASSWORD"
            echo "已自动写入 ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
          else
            echo "::warning::未配置 BOOTSTRAP_PAT，无法自动写入。请手动复制以下三个值到仓库 Secrets，填完后删除本次运行日志（含明文密钥）："
            echo "ANDROID_KEY_BASE64=$BASE64"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
          fi
